# ── Task Management API — GitLab CI Pipeline ──────────────────────────
# Stages: test → build → publish → deploy
# Triggers on every push to any branch.

variables:
  # ── Image naming ────────────────────────────────────────────────────
  IMAGE_NAME:         $CI_REGISTRY_IMAGE/app
  IMAGE_TAG:          $CI_COMMIT_SHORT_SHA
  IMAGE_TAG_LATEST:   latest

  # ── Docker-in-Docker ────────────────────────────────────────────────
  DOCKER_HOST:        tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER:      overlay2

  # ── Deployment ──────────────────────────────────────────────────────
  DEPLOY_DIR:         /opt/task-manager
  COMPOSE_PROJECT_NAME: task-manager

stages:
  - test
  - build
  - publish
  - deploy

# ═══════════════════════════════════════════════════════════════════════
# Test
# ═══════════════════════════════════════════════════════════════════════

test:
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install --no-cache-dir -r requirements.txt aiosqlite
  script:
    - pytest --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .cache/pip

# ═══════════════════════════════════════════════════════════════════════
# Build
# ═══════════════════════════════════════════════════════════════════════

build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $IMAGE_NAME:$IMAGE_TAG -t $IMAGE_NAME:$IMAGE_TAG_LATEST .
  artifacts:
    paths:
      - .gitlab-ci.yml
    expire_in: 1 hour

# ═══════════════════════════════════════════════════════════════════════
# Publish
# ═══════════════════════════════════════════════════════════════════════

publish:
  stage: publish
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker push $IMAGE_NAME:$IMAGE_TAG
    - docker push $IMAGE_NAME:$IMAGE_TAG_LATEST
  needs:
    - build

# ═══════════════════════════════════════════════════════════════════════
# Deploy
# ═══════════════════════════════════════════════════════════════════════

deploy:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client docker-compose
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
  script:
    # Copy compose file and env to the server
    - scp docker-compose.yml .env $SSH_USER@$SSH_HOST:$DEPLOY_DIR/
    - scp -r config/ $SSH_USER@$SSH_HOST:$DEPLOY_DIR/

    # Pull new image and restart
    - ssh $SSH_USER@$SSH_HOST "
        cd $DEPLOY_DIR &&
        docker compose pull &&
        docker compose up -d --remove-orphans
      "
  environment:
    name: production
    url: http://$SSH_HOST:8000
  needs:
    - publish
  only:
    - Denet_Test
