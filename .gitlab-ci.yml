variables:
  IMAGE_NAME:         $CI_REGISTRY_IMAGE/app
  IMAGE_TAG:          $CI_COMMIT_SHORT_SHA
  IMAGE_TAG_LATEST:   latest

  DOCKER_HOST:        tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER:      overlay2

  DEPLOY_DIR:         /opt/task-manager
  COMPOSE_PROJECT_NAME: task-manager

stages:
  - test
  - build
  - publish
  - deploy

test:
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install --upgrade pip
    - pip install --no-cache-dir -r requirements.txt aiosqlite
  script:
    - pytest --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .cache/pip

build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $IMAGE_NAME:$IMAGE_TAG -t $IMAGE_NAME:$IMAGE_TAG_LATEST .

publish:
  stage: publish
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker push $IMAGE_NAME:$IMAGE_TAG
    - docker push $IMAGE_NAME:$IMAGE_TAG_LATEST
  needs:
    - build

deploy:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client docker-compose
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
  script:
    - echo "Deploying to $DEPLOY_HOST..."
    - scp docker-compose.yml .env $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/
    - scp -r config/ $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/
    - ssh $DEPLOY_USER@$DEPLOY_HOST "
        cd $DEPLOY_DIR &&
        docker compose pull &&
        docker compose up -d --remove-orphans
      "
  environment:
    name: production
    url: http://$DEPLOY_HOST:8000
  needs:
    - publish
  only:
    - main
